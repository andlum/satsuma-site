<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title and title != site.name %}{{ title }} · {{ site.name }}{% else %}{{ site.name }}{% endif %}</title>
  <meta name="description" content="{{ description or site.description }}">
  <meta name="theme-color" content="#FFF6E9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='12' fill='%23E06A16'/%3E%3Cpath d='M16 5c2-3 5-3 6-2-2 0-4 1-6 2z' fill='%23B7E4C7'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v={{ assets.cssHash }}">
  {%- for name in scripts %}
  <script defer src="/js/{{ name }}.js?v={{ assets.jsHash[name] }}"></script>
  {%- endfor %}
</head>
<body>
  {{ content | safe }}
  <footer>
    <span>Satsuma LLC</span>
    <span>Made with <span class="heart" role="img" aria-label="love">&#9829;&#xFE0E;</span> in Brooklyn</span>
  </footer>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
          data-cf-beacon='{"token": "9b1c3e2e6d2f46e8ab2265c83015b350"}'></script>
</body>
</html>
